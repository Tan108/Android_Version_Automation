name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Select product flavor"
        required: true
        type: choice
        options:
          - qa
          - staging
          - prod

jobs:
  distribute:
    name: Build & Distribute ${{ inputs.flavor }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Create Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
          chmod 600 firebase-service-account.json

      - name: Build and distribute
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          bundle exec fastlane distribute flavor:$FLAVOR

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f firebase-service-account.json